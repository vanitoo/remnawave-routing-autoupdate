services:
  routing-updater:
    build: .
    image: ghcr.io/vanitoo/remnawave-routing-autoupdate:latest
    container_name: remnawave-routing-autoupdate
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - remnawave-network

networks:
  remnawave-network:
    name: remnawave-network
    external: true
